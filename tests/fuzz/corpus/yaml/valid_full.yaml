schema_version: tokenlint.validator.v1
validator:
  id: payments-api
  environment: prod
accepts:
  token_types:
    - jwt
  issuers:
    mode: exact
    values:
      - https://auth.example.com
  audiences:
    mode: exact
    values:
      - payments-api
  algorithms:
    - RS256
    - PS256
    - ES256
jwks:
  source: ./keys.json
  require_kid: true
requires:
  claims:
    - iss
    - sub
    - aud
    - exp
    - nbf
    - iat
    - jti
limits:
  max_ttl_seconds: 3600
  max_clock_skew_seconds: 60
claim_rules:
  - claim: scope
    operator: deny_any
    required: true
    values:
      - "*"
suppressions: []
x_company:
  owner: platform-security
  ticket: SEC-1234
