schema_version: tokenlint.validator.v1
validator:
  id: dev-api
  environment: dev
accepts:
  token_types:
    - jwt
  issuers:
    mode: exact
    values:
      - https://dev-auth.example.com
  audiences:
    mode: exact
    values:
      - dev-api
  algorithms:
    - HS256
jwks:
  source: ./dev-keys.json
requires:
  claims:
    - iss
    - aud
    - exp
limits:
  max_ttl_seconds: 86400
