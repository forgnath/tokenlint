schema_version: tokenlint.validator.v1
validator:
  id: test-api
  environment: prod
accepts:
  token_types:
    - jwt
  issuers:
    mode: exact
    values:
      - https://auth.example.com
  audiences:
    mode: exact
    values:
      - test-api
  algorithms:
    - RS256
jwks:
  source: ./keys.json
  require_kid: true
requires:
  claims:
    - iss
    - sub
    - aud
    - exp
    - iat
limits:
  max_ttl_seconds: 3600
  max_clock_skew_seconds: 60
