schema_version: tokenlint.validator.v1
validator:
  id: test-api
  environment: production
accepts:
  token_types:
    - jwt
  issuers:
    mode: exact
    values:
      - https://auth.example.com
  audiences:
    mode: exact
    values:
      - test-api
  algorithms:
    - RS256
jwks:
  source: ./keys.json
requires:
  claims:
    - iss
    - aud
    - exp
limits:
  max_ttl_seconds: 3600
